# Local Postgres only. Host port 5433 avoids clashing with a locally installed Postgres on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf
      POSTGRES_DB: bookleaf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
